<style id="antiClickjack">body { display: none !important; }</style>
<script>
  (function () {
    if (self === top) {
      var s = document.getElementById("antiClickjack");
      if (s && s.parentNode) s.parentNode.removeChild(s);
    } else {
      top.location = self.location;
    }
  })();
</script>

<div class="sidebar" [class.sidebar-collapsed]="isCollapsed">
  <div class="sidebar-header">
    <h3 *ngIf="!isCollapsed">IL Catalog</h3>
    <button class="toggle-btn" (click)="isCollapsed = !isCollapsed">☰</button>
  </div>

  <nav class="sidebar-links">
    <!-- Account Unlock: admins only (Feature.Access). GAL Search, Group Membership, Rights Management: all users. -->
    <a *ngIf="auth.hasFeatureAccess()" routerLink="account-unlock" routerLinkActive="active">
      <span class="icon">🔓</span>
      <span *ngIf="!isCollapsed">Account Unlock</span>
    </a>

    <a routerLink="gal-search" routerLinkActive="active">
      <span class="icon">📧</span>
      <span *ngIf="!isCollapsed">GAL Search</span>
    </a>

    <a routerLink="group-membership" routerLinkActive="active">
      <span class="icon">👥</span>
      <span *ngIf="!isCollapsed">Group Membership</span>
    </a>

    <a routerLink="rights-management" routerLinkActive="active">
      <span class="icon">🛡️</span>
      <span *ngIf="!isCollapsed">Rights Management</span>
    </a>
  </nav>
</div>
