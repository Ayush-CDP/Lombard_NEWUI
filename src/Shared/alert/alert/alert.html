<style id="antiClickjack">body { display: none !important; }</style>
<script>
  (function () {
    if (self === top) {
      var s = document.getElementById("antiClickjack");
      if (s && s.parentNode) s.parentNode.removeChild(s);
    } else {
      top.location = self.location;
    }
  })();
</script>

<div *ngIf="displayMessage" class="alert" [ngClass]="type" style="display: flex; justify-content: space-between;">
  <span class="alert-text">{{ displayMessage }}</span>
  <span style="cursor: pointer;" (click)="Close()" aria-label="Close">✕</span>
</div>
