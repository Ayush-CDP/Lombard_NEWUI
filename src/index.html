<body>
  <style id="antiClickjack">body { display: none !important; }</style>
  <script>
    (function () {
      if (self === top) {
        var style = document.getElementById("antiClickjack");
        if (style && style.parentNode) style.parentNode.removeChild(style);
      } else {
        top.location = self.location;
      }
    })();
  </script>
